name: Lincoln - validación sin secretos
on:
  push:
    branches: ['main', 'lincoln/**']
    paths: ['lincoln_proyecto/**', '.github/workflows/lincoln-validacion.yml']
  pull_request:
    paths: ['lincoln_proyecto/**', '.github/workflows/lincoln-validacion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lincoln-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lincoln_proyecto
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/validar_base.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node exports/verificar_workflow_v03.cjs
      - run: python3 src/run_demo.py
      - run: node tests/verificar_n8n_loops.cjs
      - run: python3 skills/vizdata/scripts/audit_viz_spec.py docs/vizdata_brief.json --strict
      - run: python3 tests/validar_web.py
      - run: node tests/test_web.cjs
      - run: node tests/test_workflow_v04.cjs
      - run: node tests/test_preparacion_programada.cjs
      - run: node tests/test_workflow_v06.cjs
      - run: node tests/test_guard_proxy.cjs
      - run: python3 src/validar_paquete.py
  publicar:
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: lincoln_proyecto/web
      - name: Esperar disponibilidad del artefacto
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          python3 lincoln_proyecto/src/esperar_artefacto_pages.py
          # El listado REST ya lo ve; dar margen al índice consultado por deploy-pages.
          sleep 15
      - name: Publicar panel validado
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  empaquetar:
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar generador PDF
        run: python3 -m pip install reportlab==4.4.10
      - name: Generar informe de revisión
        run: python3 lincoln_proyecto/src/generar_informe.py
      - name: Verificar y empaquetar commit
        run: python3 lincoln_proyecto/src/empaquetar_entrega.py
      - name: Guardar paquete de revisión
        uses: actions/upload-artifact@v4
        with:
          name: Lincoln-Proyecto-Revision
          path: |
            output/Freijo_Valdovinos_Sofia_AI_Tools_ProyectoFinal_REVISION.zip
            output/pdf/Informe_Lincoln_Revision.pdf
          if-no-files-found: error
          retention-days: 30
